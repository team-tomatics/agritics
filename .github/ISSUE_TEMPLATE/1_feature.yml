name: "✨ Feature"
description: "데이터 · 서빙 · MLOps · 모니터링 · 보고서 기능 구현"
title: "[FEAT] "
labels: ["feature"]

body:
  - type: dropdown
    id: area
    attributes:
      label: 담당 파트
      options:
        - "A 데이터 (data/ · routers/data.py · scripts/train_baseline_v1.py · config/items.yaml · report_sidecar/prompts) — 심준용"
        - "B 서빙 (schemas · routers/predict·health·report · model_loader · main · history_log · report_sidecar/generator) — 박유진"
        - "C MLOps (train_and_register · lstm_model · Dockerfile · docker-compose · requirements) — 황재원"
        - "D 모니터링 (monitoring/ · scripts/simulate_drift.py · static/index.html · routers/logs · report_sidecar/observe) — 민영은"
        - "공용 (docs/ · .github/ · .env.example · README)"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 품목 범위
      description: "서비스는 농수산물 전체, 구현은 토마토. 대부분은 '전 품목 공통'이어야 합니다 (docs/ROLES.md 0-1)"
      options:
        - "전 품목 공통 (품목은 config/items.yaml 에서)"
        - "사계절용 그룹"
        - "계절용 그룹 (설계 · 발표용)"
        - "토마토 전용 (데이터 · 임계값 등 값만)"
    validations:
      required: true

  - type: textarea
    id: about
    attributes:
      label: About
      description: 구현하려는 기능 — 목적, 입력 → 출력 (API 라면 요청 · 응답 필드)
      placeholder: "예: 이력 로그 미들웨어. /predict 요청마다 logs/history.jsonl 에 ts · latency_ms · model_version · predicted 한 줄"

  - type: input
    id: plan
    attributes:
      label: 기획서 근거
      description: docs/기획서.md 의 절 (표 행까지 적으면 좋음)
      placeholder: "예: ② 핵심 기능 '이력 로그' 행 + ③ 3-2 응답 지연 · 에러율"

  - type: textarea
    id: todo
    attributes:
      label: To Do
      value: |
        - [ ] Task 1
        - [ ] Task 2

  - type: textarea
    id: dod
    attributes:
      label: 완료 조건 (DoD)
      value: |
        - [ ] 로컬 `uvicorn serving_app.main:app --port 8077` 기동 → `/docs` 에서 확인
        - [ ] 공유 상수(입력 길이 · 윈도우 · 임계값 · 기준 가격 · 모델 이름)를 바꿨다면 docs/ROLES.md 3장의 모든 위치를 같이 고침
        - [ ] (컨테이너 영향 시) `docker compose -f serving_app/docker-compose.yml up --build` 통과
        - [ ] 발표 ⑥ 에 쓸 캡처 · 로그를 PR 에 첨부
        - [ ] 새 코드에 품목 이름(토마토)을 박아 넣지 않음 — config/items.yaml 또는 공유 상수
        - [ ] 남의 파일을 건드리지 않음

  - type: input
    id: blocking
    attributes:
      label: 의존 관계 (선택)
      description: "이 작업이 기다리는 것 / 막고 있는 것. 순서는 docs/ROLES.md 의존 그래프 참고"
      placeholder: "예: #2 (A 의 토마토 CSV)가 머지돼야 Dockerfile 시드 교체 가능"

  - type: markdown
    attributes:
      value: |
        ## 브랜치 생성 방법
        이슈 번호 확인 후 아래 규칙으로 브랜치를 만드세요.

        ### Branch Naming Rule
        - `feat/<issueNumber>-<slug>`

        Example: `feat/4-history-log`

        > 오른쪽 사이드바 **Development → Create a branch** 를 쓰면
        > GitHub 가 `4-feat-...` 형태로 자동 제안합니다.
        > 그 팝업에서 `feat/4-history-log` 로 **직접 고쳐서** 만들어주세요.
