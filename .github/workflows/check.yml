name: 검사

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 이름 규칙 (<type>/<이슈번호>-<slug>, PR 만)
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "branch=$BRANCH"
          if ! echo "$BRANCH" | grep -qE '^(feat|fix|chore|docs|refactor|data)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "::error::브랜치 이름이 규칙과 다릅니다: $BRANCH  →  예: feat/4-history-log (CONTRIBUTING 2장)"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: API 키 하드코딩 검사
        run: |
          if grep -rnE "sk-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|(CERT_KEY|API_KEY)\s*=\s*['\"][A-Za-z0-9-]{16,}" \
               --include='*.py' --include='*.md' --include='*.yaml' --include='*.yml' --include='*.json' --include='*.html' \
               --exclude-dir=.git --exclude-dir=.venv . ; then
            echo "::error::API 키가 코드에 들어 있습니다. .env 로 옮기세요."; exit 1
          fi

      - name: 커밋 금지 파일 검사
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|^mlflow\.db$|^mlruns/|^mlartifacts/|\.keras$|scaler\.pkl$|^data/uploads/.+\.csv$|^logs/.+\.(log|jsonl)$|^reference/' || true)
          if [ -n "$bad" ]; then echo "::error::커밋하면 안 되는 파일: $bad"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 스켈레톤 원본 스타일을 강제하지 않도록 문법 오류 · 정의 안 된 이름만 잡는다
      - name: 문법 검사 (ruff — 오류만)
        run: pipx run ruff check --select E9,F63,F7,F82 .

      - name: 공유 상수 일치 검사 (docs/ROLES.md 3장 — 서버 · 대시보드 · 시뮬레이터)
        run: python3 scripts/check_constants.py
