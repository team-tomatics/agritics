# [소유: A 데이터 · 심준용]  품목 그룹 (기획서 「품목 그룹」 표 · 교수님 피드백 10/1)
#
# 서비스 범위 = 농수산물 시세 예보. 품목은 코드가 아니라 이 설정값으로 바꾼다.
# 구현 · 발표는 사계절용 토마토 1개 모델. 나머지 품목 · 계절용 그룹은 확장 경로(설계)로만 보여 준다.
#
# 품목 하나 = 데이터 data/<key>_prices.csv + 모델 이름 <Name>_Price_Predictor + 아래 항목 하나.
# status: implemented(이번에 학습 · 서빙) / planned(데이터 확인됨, 설계만) / candidate(데이터 확인 필요)

default_item: tomato

groups:
  year_round:
    name: 사계절용
    rule: 연중 출하 — 20거래일 연속 시퀀스가 끊기지 않는다
    training: 전체 기간 학습 + 드리프트 시 최근 21거래일 fine-tuning (현재 파이프라인 그대로)
  seasonal:
    name: 계절용
    rule: 출하 철에만 거래 — 철마다 새로 시작하는 짧은 시계열
    training: 철 시작마다 새 시퀀스 — 20거래일이 쌓이기 전에는 예측하지 않음 (설계, 팀 결정)

items:
  - key: tomato
    name: 토마토
    group: year_round
    status: implemented
    data: data/tomato_prices.csv
    model_name: Tomato_Price_Predictor
    note: KAMIS 가락시장 경락가 · 등급 상 · 908거래일 (2023-10-02 ~ 2026-09-30)
  - key: tomato_ripe
    name: 토마토 완숙
    group: year_round
    status: planned
    model_name: TomatoRipe_Price_Predictor
  - key: cherry_tomato
    name: 방울토마토
    group: year_round
    status: planned
    model_name: CherryTomato_Price_Predictor
  - key: tomato_daejeo
    name: 토마토 대저
    group: seasonal
    status: planned
    model_name: TomatoDaejeo_Price_Predictor
    note: 3년 중 288일만 거래
  - key: strawberry
    name: 딸기
    group: seasonal
    status: candidate
    model_name: Strawberry_Price_Predictor
    note: 여름 공백 — 데이터 확인 필요
