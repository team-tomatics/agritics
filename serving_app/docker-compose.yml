# 서빙 앱 + 보고서 사이드카 compose
#
# 작성자: 황재원 (원본: 교수님 스켈레톤)
# 버전: v0.2.0 (2026-10-01)
# 변경 이력:
#   v0.1.0  —    교수님 스켈레톤 원본 (serving-app 단일 서비스)
#   v0.2.0  #17  report-sidecar 서비스 · logs/outputs 볼륨 공유 · env_file
#
# Day2: FastAPI 서빙 앱 컨테이너 + LLM 보고서 사이드카
#
# MLflow는 별도 서버 없이 이 컨테이너 안에서 로컬 sqlite로 트래킹합니다(Dockerfile 참고).
# 이미지 빌드 시점에 샘플 데이터 시드 -> 베이스라인 학습 -> MLflow 등록까지 전부 끝나 있으므로,
# 별도 초기화 단계나 기동 순서 없이 한 번에 띄우면 됩니다.
#
#   docker compose -f serving_app/docker-compose.yml up --build
#   -> 대시보드 http://localhost:8099/ , API 문서 http://localhost:8099/docs
#
# 로컬 uvicorn 서버(8077)와 이 컨테이너(8099)를 동시에 띄워 비교할 수 있습니다.
# Day3 드리프트 시뮬레이션은 컨테이너 "밖"(호스트 터미널, 프로젝트 루트)에서 실행합니다.
#   python scripts/simulate_drift.py --target container   # 컨테이너만
#   python scripts/simulate_drift.py --target both        # 같은 배치를 8077·8099 양쪽에 보내 비교
#   ※ eager 로딩이라 기동 후 20~60초 뒤 http://localhost:8099/health 가 model_loaded=true 일 때 실행
#
services:
  serving-app:
    build:
      context: ..
      dockerfile: serving_app/Dockerfile
    ports: ["8099:8099"]
    volumes:
      - logs:/app/logs          # history.jsonl · aiops.log — 사이드카가 읽는다
      - outputs:/app/outputs    # outputs/reports/*.md — GET /report 가 읽는다

  # 보고서 사이드카 (report_sidecar/Dockerfile). 예측 API 와 분리 — 죽어도 /predict 는 영향 없음.
  # LLM 은 외부 API — 키는 프로젝트 루트 .env 의 LLM_* (없어도 serving-app 은 뜬다)
  report-sidecar:
    build:
      context: ..
      dockerfile: report_sidecar/Dockerfile
    env_file:
      - path: ../.env
        required: false
    volumes:
      - logs:/app/logs          # 쓰기도 필요: observe.py 가 aiops.log 에 경고를 남긴다
      - outputs:/app/outputs
    depends_on: [serving-app]

volumes:
  logs:
  outputs:
